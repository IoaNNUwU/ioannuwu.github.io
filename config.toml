# The URL the site will be built for
base_url = "https://ioannuwu.github.io/"

# The site title and description; used in feeds by default.
title = "Bitwise | @ioannuwu"
description = "Personal website"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# When set to "true", a feed is automatically generated.
generate_feeds = true

# The default author for pages
author = "Bitwise | ioannuwu"

# The taxonomies to be rendered for the site and their configuration of the default languages
# Example:
#     taxonomies = [
#       {name = "tags", feed = true}, # each tag will have its own feed
#       {name = "tags"}, # you can have taxonomies with the same name in multiple languages
#       {name = "categories", paginate_by = 5},  # 5 items per page for a term
#       {name = "authors"}, # Basic definition: no feed or pagination
#     ]
#
taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true, paginate_by = 5 },
]

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true

# The theme to use for code highlighting.
# See below for list of allowed values.
highlight_theme = "nord"
# light: ascetic-white, ayu-light, base16-atelierdune-light, base16-ocean-light, bbedit, cheerfully-light, demain, inspired-github, ir-white, material-light, OneHalfLight, solarized-light, Tomorrow

# dark: 1337, agola-dark, axar, ayu-dark, ayu-mirage, base16-ocean-dark, boron, charcoal, dimmed-fluid, dracula, gray-matter-dark, green, gruvbox-dark, kronuz, material-dark, monokai, nord, nyx-bold, one-dark, OneHalfDark, railsbase16-green-screen-dark, solarized-dark, subway-madrid, subway-moscow, two-dark, visual-studio-dark, zenburn

# When set to "true", emoji aliases translated to their corresponding
# Unicode emoji equivalent in the rendered Markdown files. (e.g.: :smile: => 😄)
render_emoji = true

# Whether footnotes are rendered in the GitHub-style (at the bottom, with back references) or plain (in the place, where they are defined)
bottom_footnotes = true

[extra]
close_responsive_menu_on_resize = true
copy_button = true
favicon = "images/logo_one_dark.svg"
fediverse_creator = "@ebkalderon@hachyderm.io"
layout = "center"
show_default_author = false

main_menu = [
    { name = "blog", url = "blog", trailing_slash = true },
    { name = "archive", url = "archive", trailing_slash = true },
    { name = "tags", url = "tags", trailing_slash = true },
    { name = "projects", url = "projects", trailing_slash = true },
    { name = "github", url = "https://github.com/ebkalderon/terminus", new_tab = true },
]

socials = [
    { name = "email", url = "mailto:hello@example.com" },
    { name = "github", url = "https://github.com/ebkalderon" },
    { name = "linkedin", url = "https://www.linkedin.com/in/ebkalderon" },
    { name = "mastodon", url = "https://hachyderm.io/@ebkalderon" },
    { name = "keyoxide", url = "https://keyoxide.org/d5ad5bd47835b0f0b0c3046c00ab4c0942dcba25" },
]

[extra.responsive_images]
widths = [640, 784, 1280, 1920, 2560]
fallback_width = 1280
